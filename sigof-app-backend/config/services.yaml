# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters: {}

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Point d'accès unique aux paramètres/env (Shared/Config) : aucun autre service
    # ne doit recevoir un paramètre kernel.*/env(...) lié en dur, il dépend de ce service.
    App\Shared\Config\AppConfig:
        bind:
            string $kernelProjectDir: '%kernel.project_dir%'
            string $appEnv: '%kernel.environment%'

    # Couche Service ServiceReglement : lie chaque interface à son implémentation concrète.
    # Interfaces et implémentations vivent toutes deux dans Module/ServiceReglement/Service/.
    App\Module\ServiceReglement\Service\FicheDepotServiceInterface: '@App\Module\ServiceReglement\Service\FicheDepotService'
    App\Module\ServiceReglement\Service\DashboardServiceInterface: '@App\Module\ServiceReglement\Service\DashboardService'
    App\Module\ServiceReglement\Service\FicheDepotExcelGeneratorInterface: '@App\Module\ServiceReglement\Service\FicheDepotExcelGenerator'
    App\Module\ServiceReglement\Service\UtilisateurServiceInterface: '@App\Module\ServiceReglement\Service\UtilisateurService'
    App\Module\ServiceReglement\Service\HistoriqueServiceInterface: '@App\Module\ServiceReglement\Service\HistoriqueService'

    # Le dossier des fiches generees passe desormais par Shared/Config/AppConfig
    # (injecte automatiquement, plus besoin de bind explicite ici).
