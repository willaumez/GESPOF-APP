doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'

                # IMPORTANT: You MUST configure your server version,
                # either here or in the DATABASE_URL env var (see .env file)
                #server_version: '16'

                profiling_collect_backtrace: '%kernel.debug%'

            # Base Oracle SGP — accès en LECTURE SEULE au schéma SGP.
            # Nécessite l'extension PHP oci8 ou pdo_oracle (voir SGP_DATABASE_URL dans .env.local).
            # Aucune migration ni écriture ne doit être faite sur cette connexion :
            # les commandes doctrine:migrations:* ciblent l'EM "default" par défaut, ne jamais leur passer --em=sgp.
            sgp:
                url: '%env(resolve:SGP_DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'

            # Réplique PostgreSQL en lecture seule (facultatif, à activer si une vraie
            # 2e base Postgres arrive un jour — pour l'instant "sgp" ci-dessus est le
            # seul esclave réel, voir ConnectionManager). Base indépendante, jamais de
            # fallback vers "default" si indisponible (voir DatabaseReader).
            #slave1:
            #    url: '%env(resolve:SLAVE1_DATABASE_URL)%'
            #    profiling_collect_backtrace: '%kernel.debug%'
            #slave2:
            #    url: '%env(resolve:SLAVE2_DATABASE_URL)%'
            #    profiling_collect_backtrace: '%kernel.debug%'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                auto_mapping: true
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App

            # Entity manager dédié à la base Oracle SGP, schéma SGP — lecture seule.
            # Les entités vivent hors de src/Entity pour ne pas être aussi scannées par l'EM "default".
            sgp:
                connection: sgp
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                mappings:
                    Sgp:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/EntitySgp'
                        prefix: 'App\EntitySgp'
                        alias: Sgp

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
